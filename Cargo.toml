[workspace]
members = ["."]
resolver = "2"

[package]
name = "mina"
version = "0.2.0-dev"
edition = "2021"
description = "Passive SSH session auditor — watches, records, reports"
license = "MIT"
authors = ["Benoît Allard <benoit.allard@gmx.de>"]
repository = "https://github.com/benallard/mina"
homepage = "https://github.com/benallard/mina"
readme = "README.md"

[[bin]]
name = "mina"
path = "src/main.rs"

[[bin]]
name = "mina-nest"
path = "src/nest.rs"

[lib]
name = "mina_lib"
path = "src/lib.rs"

[dependencies]
anyhow   = "1"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
toml     = "0.8"
chrono   = { version = "0.4", features = ["serde"] }
tracing-subscriber = "0.3"
clap     = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
