[workspace]
members = [".", "nest"]
resolver = "2"

[package]
name = "mina"
version = "0.1.0"
edition = "2021"
description = "Passive SSH session auditor — watches, records, reports"
license = "MIT"
repository = "https://github.com/yourorg/mina"

[[bin]]
name = "mina"
path = "src/main.rs"

[lib]
name = "mina_lib"
path = "src/lib.rs"

[dependencies]
anyhow   = "1"
thiserror = "1"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
toml     = "0.8"
chrono   = { version = "0.4", features = ["serde"] }
tracing  = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
