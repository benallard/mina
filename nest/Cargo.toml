[package]
name = "mina-nest"
version = "0.1.0"
edition = "2021"
description = "Mina nest — optional HTTPS ingest endpoint"
license = "MIT"

[[bin]]
name = "mina-nest"
path = "src/main.rs"

[dependencies]
anyhow   = "1"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
toml     = "0.8"
chrono   = { version = "0.4", features = ["serde"] }
tracing  = "0.1"
tracing-subscriber = "0.3"
