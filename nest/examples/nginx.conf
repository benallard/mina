# nginx site for the Mina nest. Replace names and paths with your own.
# TLS (and, optionally, client certificates) end here; the nest behind it
# only sees plain HTTP on a Unix socket (see mina-nest.socket).
upstream mina_nest {
    server unix:/run/mina-nest.sock;
}

server {
    listen 443 ssl;
    server_name nest.example.com;

    ssl_certificate     /etc/ssl/certs/nest.example.com.pem;
    ssl_certificate_key /etc/ssl/private/nest.example.com.key;

    # Optional mutual TLS: accept only machines with a certificate from
    # this CA. The nest does not read the certificate yet; nginx alone
    # decides who may upload.
    # ssl_client_certificate /etc/ssl/certs/fleet-ca.pem;
    # ssl_verify_client      on;

    # At least the nest's upload limit (64 MiB by default).
    client_max_body_size 64m;

    location = /ingest {
        proxy_pass http://mina_nest;
        # The default; nginx reads the whole upload before passing it on,
        # so a slow client never holds a gunicorn worker.
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
